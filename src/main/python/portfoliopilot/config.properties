[MARKET_SETTINGS]
market_country = IN
run_mode = BACKTEST
total_budget = 100000.00
# Prioritise testing Swing and Momentum variations over Long-Term cash
active_strategies = SWING, MOMENTUM
active_analysts = QUANT_CORE_TREND, LTCG_COMPOUNDER, VALUATION_ALPHA

[LARGE_CAP_TIER]
# Lower this tier to free up money for the winning mid-caps
weight = 0.10
pool_size = 20
max_tickers = 2

[MID_CAP_TIER]
# Max out exposure here to let the 25.16 Sharpe Ratio handle your capital pool
weight = 0.80
pool_size = 30
max_tickers = 6

[RISKY_TIER]
# Lower this tier to a defensive minimum to insulate your overall portfolio
weight = 0.10
pool_size = 30
max_tickers = 2

[STRATEGY_TIMEFRAME_OVERRIDES]
# Extended horizons to minimize trading frequency and bypass high-churn friction
swing_lookback_days = 20
swing_rebalance_days = 3

momentum_lookback_days = 30
momentum_rebalance_days = 25

# Long-Term Horizons
long_term_lookback_days = 60
long_term_rebalance_days = 20

# Options Horizons
options_lookback_days = 20
options_rebalance_days = 10

