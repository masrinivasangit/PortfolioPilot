[MARKET_SETTINGS]
market_country = IN
run_mode = BACKTEST
total_budget = 100000.00
# RE-ACTIVATE MOMENTUM & LONG_TERM: Forces the engine to buy breakouts as the index rises
active_strategies = MOMENTUM, LONG_TERM
active_analysts = QUANT_CORE_TREND, VALUATION_ALPHA, GEMINI_AI_TREND

[BACKTEST_SETTINGS]
# BACKTEST HORIZON EXTENSION: Select a known strong macro expansion window
start_date = 2023-11-01
end_date = 2024-05-30

[LARGE_CAP_TIER]
# Max out allocation to your alpha-generating Mid-Cap and Large-Cap tiers
weight = 0.40
pool_size = 20
max_tickers = 3

[MID_CAP_TIER]
weight = 0.50
pool_size = 30
max_tickers = 4

[RISKY_TIER]
weight = 0.10
pool_size = 20
max_tickers = 1

[STRATEGY_TIMEFRAME_OVERRIDES]
swing_lookback_days = 15
swing_rebalance_days = 3

# Keep momentum tight (5 days) to rapidly scale compounding positions
momentum_lookback_days = 15
momentum_rebalance_days = 5

long_term_lookback_days = 30
long_term_rebalance_days = 15
